name: WeAreDevelopers Countdown Slack

on:
  schedule:
    # 7:00 AM Eastern during daylight saving time.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wearedevelopers-countdown-slack
  cancel-in-progress: false

env:
  EVENT_DATE: "2026-07-08"
  PROGRESS_TOTAL_DAYS: "45"
  TIMEZONE: "America/New_York"

jobs:
  post-countdown:
    name: Post countdown
    runs-on: ubuntu-latest
    steps:
      - name: Post Slack countdown message
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.ENTIRE_SLACK_CHANNEL_ID }}
        run: |
          python3 <<'PY'
          import binascii
          import datetime as dt
          import json
          import os
          import struct
          import sys
          import urllib.parse
          import urllib.request
          import zlib
          from zoneinfo import ZoneInfo

          BAR_IMAGE_PATH = "/tmp/wearedevelopers-countdown.png"
          IMAGE_WIDTH = 1000
          IMAGE_HEIGHT = 110
          BAR_X = 24
          BAR_Y = 29
          BAR_WIDTH = 952
          BAR_HEIGHT = 52
          SEGMENT_GAP = 4
          SEGMENT_RADIUS = 6

          COLOR_EMPTY = (229, 231, 235, 255)
          COLOR_GREEN = (22, 163, 74, 255)
          COLOR_YELLOW = (234, 179, 8, 255)
          COLOR_RED = (220, 38, 38, 255)

          event_date = dt.date.fromisoformat(os.environ["EVENT_DATE"])
          progress_total_days = max(1, int(os.environ["PROGRESS_TOTAL_DAYS"]))
          today = dt.datetime.now(ZoneInfo(os.environ["TIMEZONE"])).date()
          if os.environ.get("TODAY"):
              today = dt.date.fromisoformat(os.environ["TODAY"])
          days_left = (event_date - today).days

          if days_left < 0:
              print(f"Countdown complete; event date was {event_date}.")
              sys.exit(0)

          if days_left == 0:
              headline = "Today is WeAreDevelopers. We launch there. Get hype!"
          elif days_left == 1:
              headline = "T-1 day left until WeAreDevelopers. Our product launch is soon. Get hype!"
          else:
              headline = f"T-{days_left} days left until WeAreDevelopers. Our product launch is soon. Get hype!"

          message = headline

          def bar_color(days):
              if days < 7:
                  return COLOR_RED, "red"
              if days < 30:
                  return COLOR_YELLOW, "yellow"
              return COLOR_GREEN, "green"

          def in_rounded_rect(x, y, x0, y0, x1, y1, radius):
              if x < x0 or x >= x1 or y < y0 or y >= y1:
                  return False

              corners = (
                  (x0 + radius, y0 + radius, x < x0 + radius and y < y0 + radius),
                  (x1 - radius - 1, y0 + radius, x >= x1 - radius and y < y0 + radius),
                  (x0 + radius, y1 - radius - 1, x < x0 + radius and y >= y1 - radius),
                  (x1 - radius - 1, y1 - radius - 1, x >= x1 - radius and y >= y1 - radius),
              )
              for cx, cy, active in corners:
                  if active:
                      return ((x - cx) ** 2) + ((y - cy) ** 2) <= radius**2
              return True

          def draw_rounded_rect(pixels, x0, y0, x1, y1, radius, color):
              x0 = max(0, int(round(x0)))
              y0 = max(0, int(round(y0)))
              x1 = min(IMAGE_WIDTH, int(round(x1)))
              y1 = min(IMAGE_HEIGHT, int(round(y1)))
              radius = max(0, int(round(radius)))
              for y in range(y0, y1):
                  row = y * IMAGE_WIDTH * 4
                  for x in range(x0, x1):
                      if in_rounded_rect(x, y, x0, y0, x1, y1, radius):
                          offset = row + x * 4
                          pixels[offset : offset + 4] = bytes(color)

          def png_chunk(chunk_type, data):
              return (
                  struct.pack(">I", len(data))
                  + chunk_type
                  + data
                  + struct.pack(">I", binascii.crc32(chunk_type + data) & 0xFFFFFFFF)
              )

          def write_png(path, width, height, pixels):
              raw = bytearray()
              stride = width * 4
              for y in range(height):
                  raw.append(0)
                  row_start = y * stride
                  raw.extend(pixels[row_start : row_start + stride])

              ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
              with open(path, "wb") as image_file:
                  image_file.write(b"\x89PNG\r\n\x1a\n")
                  image_file.write(png_chunk(b"IHDR", ihdr))
                  image_file.write(png_chunk(b"IDAT", zlib.compress(bytes(raw), 9)))
                  image_file.write(png_chunk(b"IEND", b""))

          def render_countdown_bar(path):
              pixels = bytearray([0, 0, 0, 0] * IMAGE_WIDTH * IMAGE_HEIGHT)

              filled_segments = min(progress_total_days, max(0, progress_total_days - days_left))
              segment_width = (BAR_WIDTH - (progress_total_days - 1) * SEGMENT_GAP) / progress_total_days
              fill_color, _ = bar_color(days_left)

              for segment in range(progress_total_days):
                  x0 = BAR_X + segment * (segment_width + SEGMENT_GAP)
                  x1 = x0 + segment_width
                  color = fill_color if segment < filled_segments else COLOR_EMPTY
                  draw_rounded_rect(pixels, x0, BAR_Y, x1, BAR_Y + BAR_HEIGHT, SEGMENT_RADIUS, color)

              write_png(path, IMAGE_WIDTH, IMAGE_HEIGHT, pixels)

          def format_slack_error(response):
              error = response.get("error", "unknown_error")
              messages = response.get("response_metadata", {}).get("messages", [])
              if messages:
                  return f"{error}: {'; '.join(messages)}"
              return error

          def slack_form_api(method, payload):
              body = urllib.parse.urlencode(payload).encode()
              request = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {slack_token}",
                      "Content-Type": "application/x-www-form-urlencoded",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          def upload_bytes(upload_url, data):
              request = urllib.request.Request(
                  upload_url,
                  data=data,
                  headers={
                      "Content-Type": "application/octet-stream",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request) as response:
                  response.read()

          render_countdown_bar(BAR_IMAGE_PATH)
          with open(BAR_IMAGE_PATH, "rb") as image_file:
              image_bytes = image_file.read()

          _, color_name = bar_color(days_left)
          completed_days = min(progress_total_days, max(0, progress_total_days - days_left))
          if days_left == 0:
              alt_count = "launch day"
              filename_count = "launch-day"
          elif days_left == 1:
              alt_count = "1 day remaining"
              filename_count = "t-1"
          else:
              alt_count = f"{days_left} days remaining"
              filename_count = f"t-{days_left}"
          alt_text = (
              f"WeAreDevelopers launch countdown: {completed_days} of {progress_total_days} days complete; "
              f"{alt_count}; {color_name} progress bar."
          )

          if os.environ.get("DRY_RUN") == "1":
              print(f"Dry run: wrote {BAR_IMAGE_PATH} ({len(image_bytes)} bytes).")
              print(message)
              sys.exit(0)

          slack_token = os.environ["SLACK_BOT_TOKEN"]
          slack_channel = os.environ["SLACK_CHANNEL_ID"]

          upload_response = slack_form_api(
              "files.getUploadURLExternal",
              {
                  "filename": f"wearedevelopers-countdown-{filename_count}.png",
                  "length": len(image_bytes),
                  "alt_txt": alt_text,
              },
          )
          if not upload_response.get("ok"):
              raise SystemExit(f"Slack upload URL failed: {format_slack_error(upload_response)}")

          upload_bytes(upload_response["upload_url"], image_bytes)

          complete_response = slack_form_api(
              "files.completeUploadExternal",
              {
                  "channel_id": slack_channel,
                  "initial_comment": message,
                  "files": json.dumps([
                      {
                          "id": upload_response["file_id"],
                          "title": "WeAreDevelopers launch countdown",
                      }
                  ]),
              },
          )
          if not complete_response.get("ok"):
              raise SystemExit(f"Slack file post failed: {format_slack_error(complete_response)}")

          print(f"Posted Slack countdown image {upload_response['file_id']}.")
          PY
