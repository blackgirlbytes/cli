# Multi-Repo Release Notes Generator for Slack
#
# Generates release notes using goose AI agent for multiple repositories
# and posts them to Slack in a single thread.
#
# Repositories monitored:
# - entireio/cli
# - entirehq/entiredb
# - entirehq/entire.io
# - go-git/go-git

name: Release Notes to Slack

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to generate notes for (or "all")'
        required: true
        type: choice
        options:
          - all
          - entireio/cli
          - entirehq/entiredb
          - entirehq/entire.io
          - go-git/go-git
      tag:
        description: 'Release tag (e.g., v1.25.0). Leave empty for latest. Ignored when "all" is selected.'
        required: false
        type: string

  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  # Build the matrix of repos to process
  build-matrix:
    name: Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_repos: ${{ steps.build.outputs.has_repos }}

    steps:
      - name: Build release matrix
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ALL_REPOS="entireio/cli entirehq/entiredb entirehq/entire.io go-git/go-git"
          RELEASES=()

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_REPO" = "all" ]; then
              # All repos - get latest tag for each
              for repo in $ALL_REPOS; do
                TAG=$(gh api "repos/${repo}/releases/latest" 2>/dev/null | jq -r '.tag_name // empty' || true)
                if [ -n "$TAG" ]; then
                  RELEASES+=("{\"repo\":\"${repo}\",\"tag\":\"${TAG}\"}")
                  echo "::notice::Adding ${repo}@${TAG}"
                else
                  echo "::warning::No release found for ${repo}"
                fi
              done
            else
              # Single repo
              if [ -n "$INPUT_TAG" ]; then
                TAG="$INPUT_TAG"
              else
                TAG=$(gh api "repos/${INPUT_REPO}/releases/latest" | jq -r '.tag_name')
              fi
              RELEASES+=("{\"repo\":\"${INPUT_REPO}\",\"tag\":\"${TAG}\"}")
              echo "::notice::Adding ${INPUT_REPO}@${TAG}"
            fi
          else
            # Scheduled: check for releases in last 24 hours
            CUTOFF=$(date -d '24 hours ago' -u +%Y-%m-%dT%H:%M:%SZ)

            for repo in $ALL_REPOS; do
              RELEASE_INFO=$(gh api "repos/${repo}/releases/latest" 2>/dev/null || echo '{}')
              PUBLISHED=$(echo "$RELEASE_INFO" | jq -r '.published_at // empty')
              TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')

              if [ -n "$PUBLISHED" ] && [ -n "$TAG" ]; then
                if [[ "$PUBLISHED" > "$CUTOFF" ]]; then
                  RELEASES+=("{\"repo\":\"${repo}\",\"tag\":\"${TAG}\"}")
                  echo "::notice::Found new release: ${repo}@${TAG}"
                fi
              fi
            done
          fi

          if [ ${#RELEASES[@]} -eq 0 ]; then
            echo "has_repos=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "::notice::No repos to process"
          else
            MATRIX=$(printf '%s\n' "${RELEASES[@]}" | jq -sc '{include: .}')
            echo "has_repos=true" >> $GITHUB_OUTPUT
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

  # Post the parent message to start the thread
  post-parent:
    name: Post Parent Message
    runs-on: ubuntu-latest
    needs: build-matrix
    if: needs.build-matrix.outputs.has_repos == 'true'
    outputs:
      thread_ts: ${{ steps.post.outputs.thread_ts }}

    steps:
      - name: Post parent message
        id: post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          TODAY=$(date -u +"%B %d, %Y")
          
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg text "📋 *Dispatch Notes* — ${TODAY}" \
            '{channel: $channel, text: $text, unfurl_links: false}')

          RESPONSE=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$(echo "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "::error::Slack API error: $(echo "$RESPONSE" | jq -r '.error')"
            exit 1
          fi

          THREAD_TS=$(echo "$RESPONSE" | jq -r '.ts')
          echo "thread_ts=$THREAD_TS" >> $GITHUB_OUTPUT
          echo "::notice::Created parent message with ts=$THREAD_TS"

  # Generate and post release notes for each repo in the thread
  generate:
    name: Generate (${{ matrix.repo }})
    runs-on: ubuntu-latest
    needs: [build-matrix, post-parent]
    if: needs.build-matrix.outputs.has_repos == 'true'
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      fail-fast: false

    container:
      image: ghcr.io/block/goose:latest
      options: --user root
      env:
        GOOSE_PROVIDER: openrouter
        GOOSE_MODEL: anthropic/claude-sonnet-4
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        HOME: /tmp/goose-home

    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git curl jq

      - name: Clone repository
        env:
          REPO: ${{ matrix.repo }}
        run: |
          git clone --depth 100 "https://github.com/${REPO}.git" /tmp/repo
          cd /tmp/repo
          git fetch --tags

      - name: Generate release notes
        env:
          REPO: ${{ matrix.repo }}
          RELEASE_TAG: ${{ matrix.tag }}
        run: |
          mkdir -p $HOME/.local/share/goose/sessions
          mkdir -p $HOME/.config/goose
          cd /tmp/repo

          cat > /tmp/recipe.yaml << 'RECIPE_EOF'
          version: "1.0.0"
          title: "Release Notes Generator"
          description: "Generate release notes for a GitHub release"

          extensions:
            - type: builtin
              name: developer

          instructions: |
            Generate release notes for a GitHub release.

            Context:
            - Repository: REPO_PLACEHOLDER
            - Release Tag: TAG_PLACEHOLDER
            - You are in the cloned repository directory

            Process:
            1. Get the previous release tag: git describe --tags --abbrev=0 TAG_PLACEHOLDER^
            2. Get commits between tags: git log PREV_TAG..TAG_PLACEHOLDER --oneline --no-merges
            3. Analyze and categorize the changes

            IMPORTANT: Use Slack mrkdwn format (NOT regular Markdown):
            - *bold* (single asterisks, not double)
            - _italic_ (underscores)
            - ~strikethrough~
            - `code`
            - ```code block```
            - <https://example.com|link text> (angle brackets for links)
            - • for bullet points (not -)
            - No # headings - use *Bold Text* instead

            Output Format (skip empty sections):

            *✨ Features*
            • Description of feature (<https://github.com/REPO_PLACEHOLDER/pull/123|#123>)

            *🐛 Bug Fixes*
            • Description of fix (<https://github.com/REPO_PLACEHOLDER/pull/456|#456>)

            *🔧 Improvements*
            • Description of improvement

            *📚 Documentation*
            • Description of doc change

            *⚠️ Breaking Changes*
            • Description of breaking change

            Write ONLY the release notes content to /tmp/release_notes.md

          prompt: |
            Generate release notes for TAG_PLACEHOLDER in the REPO_PLACEHOLDER repository.
          RECIPE_EOF

          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" /tmp/recipe.yaml
          sed -i "s|TAG_PLACEHOLDER|${RELEASE_TAG}|g" /tmp/recipe.yaml
          goose run --recipe /tmp/recipe.yaml

      - name: Post to Slack thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          THREAD_TS: ${{ needs.post-parent.outputs.thread_ts }}
          REPO: ${{ matrix.repo }}
          RELEASE_TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -e

          if [ ! -f /tmp/release_notes.md ]; then
            echo "::error::Release notes not generated"
            exit 1
          fi

          NOTES=$(cat /tmp/release_notes.md)
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
          SAFE_LIMIT=2900

          post_message() {
            local text="$1"

            local payload
            payload=$(jq -n \
              --arg channel "$SLACK_CHANNEL_ID" \
              --arg text "$text" \
              --arg ts "$THREAD_TS" \
              '{channel: $channel, text: $text, thread_ts: $ts, unfurl_links: false}')

            local response
            response=$(curl -s -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")

            if [ "$(echo "$response" | jq -r '.ok')" != "true" ]; then
              echo "::error::Slack API error: $(echo "$response" | jq -r '.error')"
              return 1
            fi
          }

          # Build the message with repo header
          DIVIDER="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          HEADER=$(printf '%s\n🎉 *%s* `%s`\n<%s|View Release>\n\n' "$DIVIDER" "$REPO" "$RELEASE_TAG" "$RELEASE_URL")
          FULL_MSG="${HEADER}${NOTES}"

          # Post in chunks if needed
          if [ ${#FULL_MSG} -le $SAFE_LIMIT ]; then
            post_message "$FULL_MSG"
          else
            # Post header first
            post_message "$HEADER"
            sleep 1

            # Chunk the notes
            echo "$NOTES" > /tmp/notes_full.txt
            split -b $SAFE_LIMIT /tmp/notes_full.txt /tmp/chunk_

            for chunk_file in /tmp/chunk_*; do
              [ -f "$chunk_file" ] || continue
              CHUNK=$(cat "$chunk_file")
              [ -n "$CHUNK" ] && post_message "$CHUNK"
              sleep 1
            done
          fi

          echo "::notice::Posted release notes to Slack thread"
