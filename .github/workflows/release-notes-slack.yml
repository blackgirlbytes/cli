            echo "::group::Goose session files"
            find "$HOME/.local/share/goose/sessions" -maxdepth 3 -type f 2>/dev/null | sort || true
            echo "::endgroup::"
            echo "::group::Temporary files"
            ls -la /tmp || true
            echo "::endgroup::"
            if [ -f /tmp/goose_output.log ]; then
              echo "::group::Goose raw output"
              cat /tmp/goose_output.log || true
              echo "::endgroup::"
            fi
            if [ -f /tmp/goose_response.json ]; then
              echo "::group::Goose response"
              cat /tmp/goose_response.json || true
              echo "::endgroup::"
            fi
            exit 1
          fi

          # Create a safe filename from repo name
          SAFE_NAME=$(echo "$REPO" | tr '/' '-')
          cp /tmp/dispatch_notes.md "/tmp/notes-${SAFE_NAME}.md"

