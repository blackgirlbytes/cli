# Multi-Repo Dispatch Notes Generator for Slack
#
# Generates dispatch notes using goose AI agent for multiple repositories.
# Compares against the last published dispatch to avoid duplicates.
# Posts combined markdown notes directly to Slack.
#
# Repositories monitored:
# - entireio/cli
# - entirehq/entiredb
# - entirehq/entire.io (uses PostHog for feature flag status)
# - entirehq/git-sync
# - go-git/go-git

name: Dispatch Notes to Slack

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repositories to include'
        required: true
        type: choice
        options:
          - all
          - entireio/cli
          - entirehq/entiredb
          - entirehq/entire.io
          - entirehq/git-sync
          - go-git/go-git

  schedule:
    # Daily at 7am ET (11am UTC) - accumulates changes since last published dispatch
    - cron: '0 14 * * *'

permissions:
  contents: read

jobs:
  # Get last dispatch info and build repo matrix
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_repos: ${{ steps.build.outputs.has_repos }}
      last_dispatch_date: ${{ steps.dispatch.outputs.date }}
      last_dispatch_file: ${{ steps.dispatch.outputs.file }}
      current_date: ${{ steps.dispatch.outputs.current_date }}

    steps:
      - name: Clone entire.io for dispatch info
        env:
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/entirehq/entire.io.git" /tmp/entire-io

      - name: Get last dispatch info
        id: dispatch
        run: |
          CURRENT_DATE=$(TZ=America/New_York date +%F)
          CURRENT_DATE_NUM=$(printf '%s' "$CURRENT_DATE" | tr -d '-')
          DISPATCH_DIR="/tmp/entire-io/website/src/routes/_content/blog/-content"
          
          # Get latest dispatch file. Current dispatch posts may be .md or .mdx.
          find "$DISPATCH_DIR" -maxdepth 1 -type f \( -iname '*dispatch*.md' -o -iname '*dispatch*.mdx' \) | sort | while read -r f; do
            FILE_DATE=$(basename "$f" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            FILE_DATE_NUM=$(printf '%s' "$FILE_DATE" | tr -d '-')
            if [ -n "$FILE_DATE" ] && [ "$FILE_DATE_NUM" -le "$CURRENT_DATE_NUM" ]; then
              echo "$f"
            fi
          done > /tmp/dispatch-files.txt

          LATEST_DISPATCH=$(tail -1 /tmp/dispatch-files.txt)
          
          if [ -z "$LATEST_DISPATCH" ]; then
            echo "::error::No dispatch files dated on or before ${CURRENT_DATE} found"
            exit 1
          fi
          
          FILENAME=$(basename "$LATEST_DISPATCH")
          # Extract date from filename (e.g., 2026-04-06-entire-dispatch-0x0008.md -> 2026-04-06)
          DISPATCH_DATE=$(echo "$FILENAME" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')
          
          echo "file=$LATEST_DISPATCH" >> "$GITHUB_OUTPUT"
          echo "date=$DISPATCH_DATE" >> "$GITHUB_OUTPUT"
          echo "current_date=${CURRENT_DATE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Last dispatch: $FILENAME (date: $DISPATCH_DATE); current date: ${CURRENT_DATE}"
          
          # Save dispatch content for later use
          cp "$LATEST_DISPATCH" /tmp/last_dispatch.md

      - name: Upload dispatch content
        uses: actions/upload-artifact@v4
        with:
          name: last-dispatch
          path: /tmp/last_dispatch.md
          retention-days: 1

      - name: Fetch PostHog feature flags
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY || secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || vars.POSTHOG_HOST || vars.POSTHOG_ENDPOINT || 'https://eu.posthog.com' }}
        run: |
          if [ -z "${POSTHOG_PERSONAL_API_KEY}" ]; then
            echo "::error::Missing PostHog personal API key. Set the POSTHOG_PERSONAL_API_KEY secret."
            exit 1
          fi

          if [ -z "${POSTHOG_PROJECT_ID}" ]; then
            echo "::error::Missing PostHog project ID. Set POSTHOG_PROJECT_ID as a repository variable or secret."
            exit 1
          fi

          if [[ "${POSTHOG_PERSONAL_API_KEY}" == phc_* ]]; then
            echo "::error::POSTHOG_PERSONAL_API_KEY appears to be a PostHog project token. Feature flag listing requires a personal API key."
            exit 1
          fi

          POSTHOG_API_HOST="${POSTHOG_API_HOST%/}"
          POSTHOG_API_HOST="${POSTHOG_API_HOST/\/\/us.i.posthog.com/\/\/us.posthog.com}"
          POSTHOG_API_HOST="${POSTHOG_API_HOST/\/\/eu.i.posthog.com/\/\/eu.posthog.com}"
          STATUS=$(curl -sS -w "%{http_code}" -o /tmp/posthog_flags_response.json \
            -H "Authorization: Bearer ${POSTHOG_PERSONAL_API_KEY}" \
            "${POSTHOG_API_HOST}/api/projects/${POSTHOG_PROJECT_ID}/feature_flags/?limit=100")

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::error::PostHog feature flag fetch failed with HTTP ${STATUS}"
            jq -r '.detail // .error // .' /tmp/posthog_flags_response.json
            exit 1
          fi

          if ! jq -e '.results | type == "array"' /tmp/posthog_flags_response.json >/dev/null; then
            echo "::error::PostHog feature flag response did not include a results array"
            cat /tmp/posthog_flags_response.json
            exit 1
          fi

          mv /tmp/posthog_flags_response.json /tmp/posthog_flags.json
          
          echo "::notice::Fetched $(jq '.results | length' /tmp/posthog_flags.json) feature flags from PostHog"

      - name: Upload PostHog flags
        uses: actions/upload-artifact@v4
        with:
          name: posthog-flags
          path: /tmp/posthog_flags.json
          retention-days: 1

      - name: Build repo matrix
        id: build
        env:
          INPUT_REPOS: ${{ inputs.repos }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          build_repo_json() {
            case "$1" in
              "entireio/cli")
                printf '{"repo":"%s","recipe_type":"standard"}\n' "$1"
                ;;
              "entirehq/entiredb")
                printf '{"repo":"%s","recipe_type":"standard"}\n' "$1"
                ;;
              "entirehq/entire.io")
                printf '{"repo":"%s","recipe_type":"entire_io"}\n' "$1"
                ;;
              "entirehq/git-sync")
                printf '{"repo":"%s","recipe_type":"standard"}\n' "$1"
                ;;
              "go-git/go-git")
                printf '{"repo":"%s","recipe_type":"go_git"}\n' "$1"
                ;;
              *)
                echo "::error::Unsupported repo: $1"
                exit 1
                ;;
            esac
          }

          ALL_REPOS="entireio/cli entirehq/entiredb entirehq/entire.io entirehq/git-sync go-git/go-git"
          REPOS=()

          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_REPOS" = "all" ]; then
            for repo in $ALL_REPOS; do
              REPOS+=("$(build_repo_json "$repo")")
            done
          else
            REPOS+=("$(build_repo_json "$INPUT_REPOS")")
          fi

          MATRIX=$(printf '%s\n' "${REPOS[@]}" | jq -sc '{include: .}')
          echo "has_repos=true" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  # Generate notes for each repo
  generate:
    name: Generate (${{ matrix.repo }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    container:
      image: ghcr.io/block/goose:latest
      options: --user root
      env:
        GOOSE_PROVIDER: openrouter
        GOOSE_MODEL: anthropic/claude-opus-4.5
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        HOME: /tmp/goose-home

    steps:
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          apt-get update && apt-get install -y git curl jq
          
          # Install GitHub CLI
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update && apt-get install -y gh
          
          # Verify gh is authenticated
          gh auth status

      - name: Download last dispatch
        uses: actions/download-artifact@v4
        with:
          name: last-dispatch
          path: /tmp

      - name: Download PostHog flags
        uses: actions/download-artifact@v4
        with:
          name: posthog-flags
          path: /tmp

      - name: Clone repository
        env:
          REPO: ${{ matrix.repo }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/repo
          cd /tmp/repo
          git fetch --tags

      - name: Generate dispatch notes
        env:
          REPO: ${{ matrix.repo }}
          RECIPE_TYPE: ${{ matrix.recipe_type }}
          LAST_DISPATCH_DATE: ${{ needs.prepare.outputs.last_dispatch_date }}
          CURRENT_DATE: ${{ needs.prepare.outputs.current_date }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          mkdir -p $HOME/.local/share/goose/sessions
          mkdir -p $HOME/.config/goose
          cd /tmp/repo

          case "$RECIPE_TYPE" in
            entire_io)
            cat > /tmp/recipe.yaml << 'RECIPE_EOF'
          version: "1.0.0"
          title: "Dispatch Notes Generator (entire.io)"
          description: "Generate dispatch notes for entire.io with feature flag awareness"

          extensions:
            - type: builtin
              name: developer

          response:
            json_schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: "Markdown tables for the dispatch notes"
              required:
                - markdown

          instructions: |
            Generate dispatch notes for entire.io in MARKDOWN TABLE format.
            This repo deploys continuously to main, but some features are behind feature flags.

            Context:
            - Repository: entirehq/entire.io
            - Last Dispatch Date: DATE_PLACEHOLDER
            - Current Date: CURRENT_DATE_PLACEHOLDER
            - You are in the cloned repository directory
            - The last dispatch content is at /tmp/last_dispatch.md
            - PostHog feature flags data is at /tmp/posthog_flags.json
            - The repo's feature flag definitions are in feature-flags.json

            Process:
            1. Read /tmp/last_dispatch.md to see what was already covered - DO NOT include those items
            2. Get all commits/merges to main from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --first-parent main --oneline
            3. For each commit, get the associated PR number from the commit message or use:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --first-parent main --format="%s" | grep -oE '#[0-9]+'
            4. Read /tmp/posthog_flags.json to get current feature flag states
            5. Read feature-flags.json in the repo to see which flags are defined
            6. For each merged PR/commit from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER:
               - Search the codebase for whether this change references a feature flag
               - Look up that flag's status in posthog_flags.json
            7. Categorize and determine "Public" status:
               - "Released" + Public=Y: No feature flag OR flag is active with 100% rollout
               - "Released" + Public=N: Should not happen (if released, it's public)
               - "Merged but not released" + Public=N: Behind a flag that is inactive OR < 100% rollout
               - Add a visibility reason for Public=N items: "Feature flagged", "Partial rollout", "Internal only", or "Disabled"

            PostHog flag status interpretation (from posthog_flags.json):
            - "active": true AND rollout_percentage: 100 (or no rollout_percentage) → Public = Y, Visibility = Public
            - "active": true AND rollout_percentage < 100 → Public = N, Visibility = Partial rollout
            - "active": false → Public = N, Visibility = Disabled
            - "active": true with filters (like @entire.io email) → Public = N, Visibility = Internal only
            - No flag reference in code → Public = Y, Visibility = Public

            Determining PR Author and External Contributor Status:
            For each PR, get the author and their email using:
              gh pr view <PR_NUMBER> --repo entirehq/entire.io --json author --jq '.author.login'
              gh api /users/<username> --jq '.email'
            
            Someone is an EMPLOYEE if ANY of these are true:
            1. They are a member of the GitHub org: gh api /orgs/entirehq/members/<username> returns success
            2. Their GitHub email ends with @entire.io
            
            Only mark as "(external contributor)" if BOTH checks fail (not in org AND email doesn't end with @entire.io)

            IMPORTANT: Output must be MARKDOWN TABLES with these exact formats:

            ## 📦 Released

            | Change | PR | Author | Public | Visibility |
            |--------|-----|--------|--------|------------|
            | Brief description | [#123](https://github.com/entirehq/entire.io/pull/123) | @employee | Y | Public |
            | Another change | [#124](https://github.com/entirehq/entire.io/pull/124) | @outsider (external contributor) | Y | Public |

            ## 🔀 Merged (not yet released)

            | Change | PR | Author | Public | Visibility |
            |--------|-----|--------|--------|------------|
            | Feature behind partial rollout | [#125](https://github.com/entirehq/entire.io/pull/125) | @employee | N | Partial rollout |
            | Internal-only feature | [#126](https://github.com/entirehq/entire.io/pull/126) | @outsider (external contributor) | N | Internal only |

            Rules:
            - ALWAYS include BOTH sections with their tables
            - Do not include future-dated items after CURRENT_DATE_PLACEHOLDER
            - If a section has no items, include the table header with a single row: | _None this period_ | - | - | - | - |
            - DO NOT mention feature flag names - users don't know about them
            - Keep change descriptions concise (under 60 chars) and user-focused
            - Exclude anything already mentioned in the last dispatch
            - PR links must be full markdown links: [#123](url)
            - Author column: @username for employees, @username (external contributor) for non-org members
            - Public column: Y = visible to all users, N = not yet visible
            - Visibility column: use Public, Feature flagged, Partial rollout, Internal only, or Disabled
            - Return the final result as JSON with a single "markdown" field containing ONLY the markdown tables

          prompt: |
            Generate dispatch notes for entirehq/entire.io showing changes from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER.
            Return JSON with a single "markdown" field whose value is the markdown tables.
            Check /tmp/last_dispatch.md to avoid duplicates.
            For each PR, look up the author and check if they are an org member.
          RECIPE_EOF
            ;;
            standard)
            cat > /tmp/recipe.yaml << 'RECIPE_EOF'
          version: "1.0.0"
          title: "Dispatch Notes Generator (standard)"
          description: "Generate dispatch notes for internal repos with tagged releases"

          extensions:
            - type: builtin
              name: developer

          response:
            json_schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: "Markdown tables for the dispatch notes"
              required:
                - markdown

          instructions: |
            Generate dispatch notes for a repository in MARKDOWN TABLE format.

            Context:
            - Repository: REPO_PLACEHOLDER
            - Last Dispatch Date: DATE_PLACEHOLDER
            - Current Date: CURRENT_DATE_PLACEHOLDER
            - You are in the cloned repository directory
            - The last dispatch content is at /tmp/last_dispatch.md

            Process:
            1. Read /tmp/last_dispatch.md to see what was already covered (releases mentioned, PRs linked)
            2. Get all releases/tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER, including stable, prerelease, and nightly tags:
               git tag --sort=-creatordate | head -20
               git log --tags --simplify-by-decoration --pretty="format:%ai %d" | head -20
               gh release list --limit 30
            3. Separate release tags into:
               - "Released": stable tags only (for example v0.5.5)
               - "Nightly release": nightly/prerelease tags (for example v0.5.6-nightly.202604170646.96867cdc)
            4. Get all merges to main/master from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --merges --first-parent main --oneline
               Or for commits:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --first-parent main --oneline
            5. Extract PR numbers from commit messages (look for #NNN patterns)
            6. Get open PRs that are candidates for "Not merged yet":
               gh pr list --repo REPO_PLACEHOLDER --state open --limit 50 --json number,title,author,updatedAt,url
            7. Cross-reference with the last dispatch - exclude anything already mentioned
            8. Categorize:
               - "Released": Changes that are part of stable release tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER
               - "Nightly release": Changes that are part of nightly/prerelease tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER
               - "Not merged yet": Open PRs that are not represented in either the Released or Nightly release sections
            9. For "Not merged yet", prefer open PRs updated from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER and keep only the most relevant, user-facing items

            Determining PR Author and External Contributor Status:
            For each PR or open PR candidate, get the author and their email using:
              gh pr view <PR_NUMBER> --repo REPO_PLACEHOLDER --json author --jq '.author.login'
              gh api /users/<username> --jq '.email'
            
            Where <ORG> is extracted from REPO_PLACEHOLDER (e.g., "entireio" from "entireio/cli")
            
            Someone is an EMPLOYEE if ANY of these are true:
            1. They are a member of the GitHub org: gh api /orgs/<ORG>/members/<username> returns success
            2. Their GitHub email ends with @entire.io
            
            Only mark as "(external contributor)" if BOTH checks fail (not in org AND email doesn't end with @entire.io)
            
            For go-git/go-git, all contributors are external (not your org)

            IMPORTANT: Output must be MARKDOWN TABLES with these exact formats:

            ## 📦 Released

            | Change | PR | Author |
            |--------|-----|--------|
            | `v5.13.0` - Add shallow clone support | [#123](https://github.com/REPO_PLACEHOLDER/pull/123) | @employee |
            | `v5.12.1` - Hotfix for auth issue | [#125](https://github.com/REPO_PLACEHOLDER/pull/125) | @employee |

            ## 🌙 Nightly release

            | Change | PR | Author |
            |--------|-----|--------|
            | `v0.5.6-nightly.202604170646.96867cdc` - Improve release detection | [#124](https://github.com/REPO_PLACEHOLDER/pull/124) | @employee |
            | `v0.5.6-nightly.202604170646.96867cdc` - Fix memory leak in fetch | [#124](https://github.com/REPO_PLACEHOLDER/pull/124) | @outsider (external contributor) |

            ## 🚧 Not merged yet

            | Change | PR | Author |
            |--------|-----|--------|
            | Feature waiting for next release | [#126](https://github.com/REPO_PLACEHOLDER/pull/126) | @employee |
            | Bug fix in main | [#127](https://github.com/REPO_PLACEHOLDER/pull/127) | @outsider (external contributor) |

            Rules:
            - ALWAYS include ALL THREE sections with their tables
            - Do not include future-dated items after CURRENT_DATE_PLACEHOLDER
            - If a section has no items, include the table header with a single row: | _None this period_ | - | - |
            - EVERY item in "Released" MUST start with a stable release tag (e.g., `v5.13.0` - description)
            - EVERY item in "Nightly release" MUST start with a nightly/prerelease tag (e.g., `v0.5.6-nightly.202604170646.96867cdc` - description)
            - Group Released and Nightly release items by their release tag version
            - Keep change descriptions concise (under 60 chars)
            - Exclude anything already mentioned in the last dispatch
            - Do NOT put an item in "Not merged yet" if that PR already appears in Released or Nightly release
            - "Not merged yet" should contain open PRs only, not already-merged commits
            - PR links must be full markdown links: [#123](url)
            - Author column: @username for employees, @username (external contributor) for non-org members
            - Return the final result as JSON with a single "markdown" field containing ONLY the markdown tables

          prompt: |
            Generate dispatch notes for REPO_PLACEHOLDER showing changes from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER.
            Return JSON with a single "markdown" field whose value is the markdown tables.
            Check /tmp/last_dispatch.md to avoid duplicates.
            For each PR, look up the author and check if they are an org member.
          RECIPE_EOF
            ;;
            go_git)
            cat > /tmp/recipe.yaml << 'RECIPE_EOF'
          version: "1.0.0"
          title: "Dispatch Notes Generator (go-git)"
          description: "Generate dispatch notes for go-git with tagged releases and external contributors"

          extensions:
            - type: builtin
              name: developer

          response:
            json_schema:
              type: object
              properties:
                markdown:
                  type: string
                  description: "Markdown tables for the dispatch notes"
              required:
                - markdown

          instructions: |
            Generate dispatch notes for go-git/go-git in MARKDOWN TABLE format.

            Context:
            - Repository: go-git/go-git
            - Last Dispatch Date: DATE_PLACEHOLDER
            - Current Date: CURRENT_DATE_PLACEHOLDER
            - You are in the cloned repository directory
            - The last dispatch content is at /tmp/last_dispatch.md

            Process:
            1. Read /tmp/last_dispatch.md to see what was already covered (releases mentioned, PRs linked)
            2. Get all releases/tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER, including stable, prerelease, and nightly tags:
               git tag --sort=-creatordate | head -20
               git log --tags --simplify-by-decoration --pretty="format:%ai %d" | head -20
               gh release list --limit 30
            3. Separate release tags into:
               - "Released": stable tags only
               - "Nightly release": nightly/prerelease tags
            4. Get all merges to main/master from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --merges --first-parent main --oneline
               Or for commits:
               git log --since="DATE_PLACEHOLDER" --until="CURRENT_DATE_PLACEHOLDER 23:59:59" --first-parent main --oneline
            5. Extract PR numbers from commit messages (look for #NNN patterns)
            6. Get open PRs that are candidates for "Not merged yet":
               gh pr list --repo go-git/go-git --state open --limit 50 --json number,title,author,updatedAt,url
            7. Cross-reference with the last dispatch - exclude anything already mentioned
            8. Categorize:
               - "Released": Changes that are part of stable release tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER
               - "Nightly release": Changes that are part of nightly/prerelease tags from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER
               - "Not merged yet": Open PRs that are not represented in either the Released or Nightly release sections
            9. For "Not merged yet", prefer open PRs updated from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER and keep only the most relevant, user-facing items

            Determining PR Author Status:
            - For go-git/go-git, treat all contributors as external contributors
            - For each PR or open PR candidate, get the author using:
              gh pr view <PR_NUMBER> --repo go-git/go-git --json author --jq '.author.login'

            IMPORTANT: Output must be MARKDOWN TABLES with these exact formats:

            ## 📦 Released

            | Change | PR | Author |
            |--------|-----|--------|
            | `v5.13.0` - Add shallow clone support | [#123](https://github.com/go-git/go-git/pull/123) | @contributor (external contributor) |

            ## 🌙 Nightly release

            | Change | PR | Author |
            |--------|-----|--------|
            | `nightly-tag` - Improve release detection | [#124](https://github.com/go-git/go-git/pull/124) | @contributor (external contributor) |

            ## 🚧 Not merged yet

            | Change | PR | Author |
            |--------|-----|--------|
            | Feature waiting for next release | [#126](https://github.com/go-git/go-git/pull/126) | @contributor (external contributor) |

            Rules:
            - ALWAYS include ALL THREE sections with their tables
            - Do not include future-dated items after CURRENT_DATE_PLACEHOLDER
            - If a section has no items, include the table header with a single row: | _None this period_ | - | - |
            - EVERY item in "Released" MUST start with a stable release tag
            - EVERY item in "Nightly release" MUST start with a nightly/prerelease tag
            - Group Released and Nightly release items by their release tag version
            - Keep change descriptions concise (under 60 chars)
            - Exclude anything already mentioned in the last dispatch
            - Do NOT put an item in "Not merged yet" if that PR already appears in Released or Nightly release
            - "Not merged yet" should contain open PRs only, not already-merged commits
            - PR links must be full markdown links: [#123](url)
            - Author column must always be: @username (external contributor)
            - Return the final result as JSON with a single "markdown" field containing ONLY the markdown tables

          prompt: |
            Generate dispatch notes for go-git/go-git showing changes from DATE_PLACEHOLDER through CURRENT_DATE_PLACEHOLDER.
            Return JSON with a single "markdown" field whose value is the markdown tables.
            Check /tmp/last_dispatch.md to avoid duplicates.
            Treat all contributors as external contributors.
          RECIPE_EOF
            ;;
            *)
            echo "::error::Unsupported recipe type: ${RECIPE_TYPE}"
            exit 1
            ;;
          esac

          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" /tmp/recipe.yaml
          sed -i "s|DATE_PLACEHOLDER|${LAST_DISPATCH_DATE}|g" /tmp/recipe.yaml
          sed -i "s|CURRENT_DATE_PLACEHOLDER|${CURRENT_DATE}|g" /tmp/recipe.yaml
          goose run --recipe /tmp/recipe.yaml 2>&1 | tee /tmp/goose_output.log

          GOOSE_RESULT=$(awk 'NF { line = $0 } END { print line }' /tmp/goose_output.log)
          printf '%s\n' "$GOOSE_RESULT" > /tmp/goose_response.json

          if ! jq -e '.markdown | type == "string" and length > 0' /tmp/goose_response.json > /dev/null; then
            echo "::error::Goose did not return a valid markdown payload for ${REPO}"
            echo "::group::Goose raw output"
            cat /tmp/goose_output.log || true
            echo "::endgroup::"
            echo "::group::Goose response"
            cat /tmp/goose_response.json || true
            echo "::endgroup::"
            exit 1
          fi

          jq -r '.markdown' /tmp/goose_response.json > /tmp/dispatch_notes.md

      - name: Save notes artifact
        env:
          REPO: ${{ matrix.repo }}
        run: |
          if [ ! -f /tmp/dispatch_notes.md ]; then
