name: Release Summary to Slack V2

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to include"
        required: true
        type: choice
        options:
          - all
          - entirehq/entire.io
          - entireio/cli
          - go-git/go-git
          - entirehq/entiredb
          - entireio/git-sync
  schedule:
    # Weekdays at 10am PT during daylight time (17:00 UTC).
    - cron: "0 17 * * 1-5"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Dispatch Context
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.window.outputs.since }}
      github_since: ${{ steps.window.outputs.github_since }}
      matrix: ${{ steps.repos.outputs.matrix }}

    steps:
      - name: Resolve dispatch window
        id: window
        env:
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/entirehq/entire.io.git" /tmp/entire-io

          DISPATCH_DIR="/tmp/entire-io/website/src/routes/_content/blog/-content"
          LATEST_DISPATCH=$(ls -1 "$DISPATCH_DIR"/*dispatch*.md 2>/dev/null | sort | tail -1)

          if [ -z "$LATEST_DISPATCH" ]; then
            echo "::error::No dispatch posts found in ${DISPATCH_DIR}"
            exit 1
          fi

          FILENAME=$(basename "$LATEST_DISPATCH")
          SINCE=$(echo "$FILENAME" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')

          if [ -z "$SINCE" ]; then
            echo "::error::Could not extract dispatch date from ${FILENAME}"
            exit 1
          fi

          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "github_since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Using latest dispatch ${FILENAME}; collecting changes since ${SINCE}."

          mkdir -p /tmp/dispatch-examples
          ls -1 "$DISPATCH_DIR"/*dispatch*.md | sort | tail -3 | while read -r f; do
            cp "$f" /tmp/dispatch-examples/
          done

      - name: Build repo matrix
        id: repos
        env:
          INPUT_REPOS: ${{ inputs.repos }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          build_repo_json() {
            case "$1" in
              "entirehq/entire.io")
                printf '{"repo":"%s","name":"Entire Web","feature_flags":true}\n' "$1"
                ;;
              "entireio/cli")
                printf '{"repo":"%s","name":"Entire CLI","feature_flags":false}\n' "$1"
                ;;
              "go-git/go-git")
                printf '{"repo":"%s","name":"Go-Git","feature_flags":false}\n' "$1"
                ;;
              "entirehq/entiredb")
                printf '{"repo":"%s","name":"EntireDB","feature_flags":false}\n' "$1"
                ;;
              "entireio/git-sync")
                printf '{"repo":"%s","name":"Git-Sync","feature_flags":false}\n' "$1"
                ;;
              *)
                echo "::error::Unsupported repo: $1"
                exit 1
                ;;
            esac
          }

          ALL_REPOS="entirehq/entire.io entireio/cli go-git/go-git entirehq/entiredb entireio/git-sync"
          REPOS=()

          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_REPOS" = "all" ]; then
            for repo in $ALL_REPOS; do
              REPOS+=("$(build_repo_json "$repo")")
            done
          else
            REPOS+=("$(build_repo_json "$INPUT_REPOS")")
          fi

          printf '%s\n' "${REPOS[@]}" | jq -sc '{include: .}' | tee /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dispatch examples
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-examples
          path: /tmp/dispatch-examples
          retention-days: 7

      - name: Fetch PostHog feature flags
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY || secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || vars.POSTHOG_HOST || vars.POSTHOG_ENDPOINT || 'https://eu.posthog.com' }}
        run: |
          if [ -z "${POSTHOG_PERSONAL_API_KEY}" ] || [ -z "${POSTHOG_PROJECT_ID}" ]; then
            echo '{"results":[]}' > /tmp/posthog_flags.json
            echo "::warning::PostHog credentials are not configured; feature flag status will need manual review."
            exit 0
          fi

          POSTHOG_API_HOST="${POSTHOG_API_HOST%/}"
          STATUS=$(curl -sS -w "%{http_code}" -o /tmp/posthog_flags.json \
            -H "Authorization: Bearer ${POSTHOG_PERSONAL_API_KEY}" \
            "${POSTHOG_API_HOST}/api/projects/${POSTHOG_PROJECT_ID}/feature_flags/?limit=100")

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::warning::PostHog feature flag fetch failed with HTTP ${STATUS}; feature flag status will need manual review."
            echo '{"results":[]}' > /tmp/posthog_flags.json
          fi

      - name: Upload feature flags
        uses: actions/upload-artifact@v4
        with:
          name: posthog-flags
          path: /tmp/posthog_flags.json
          retention-days: 7

  collect:
    name: Collect (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          bash scripts/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone target repository
        env:
          REPO: ${{ matrix.repo }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT || github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/repo
          cd /tmp/repo
          git fetch --tags

      - name: Run entire dispatch
        env:
          ENTIRE_AUTH_TOKEN: ${{ secrets.ENTIRE_API_TOKEN }}
          REPO: ${{ matrix.repo }}
          SINCE: ${{ needs.prepare.outputs.since }}
        run: |
          if [ -z "${ENTIRE_AUTH_TOKEN}" ]; then
            echo "::error::Missing ENTIRE_API_TOKEN secret; the workflow passes it to entire dispatch as ENTIRE_AUTH_TOKEN."
            exit 1
          fi

          cd /tmp/repo
          entire dispatch --repos "$REPO" --since "$SINCE" --voice neutral > /tmp/entire-dispatch.md
          cat /tmp/entire-dispatch.md

      - name: Collect GitHub release and PR data
        env:
          REPO: ${{ matrix.repo }}
          SINCE: ${{ needs.prepare.outputs.since }}
          GITHUB_SINCE: ${{ needs.prepare.outputs.github_since }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT || github.token }}
        run: |
          mkdir -p /tmp/github-data
          gh api "repos/${REPO}/releases?per_page=50" \
            --jq '[.[] | {name, tagName: .tag_name, isPrerelease: .prerelease, publishedAt: .published_at, url: .html_url}]' \
            > /tmp/github-data/releases.json

          gh pr list --repo "$REPO" --state merged --limit 100 \
            --search "merged:>=${GITHUB_SINCE}" \
            --json number,title,author,mergedAt,url,labels \
            > /tmp/github-data/merged-prs.json

          gh pr list --repo "$REPO" --state open --limit 50 \
            --json number,title,author,updatedAt,url,labels \
            > /tmp/github-data/open-prs.json

          cd /tmp/repo
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess

          github_since = os.environ["GITHUB_SINCE"]
          since_date = dt.date.fromisoformat(github_since)
          releases_path = pathlib.Path("/tmp/github-data/releases.json")
          releases = json.loads(releases_path.read_text())

          dated = []
          for release in releases:
              published = release.get("publishedAt")
              tag = release.get("tagName")
              if not published or not tag:
                  continue
              published_date = dt.datetime.fromisoformat(published.replace("Z", "+00:00")).date()
              dated.append((published_date, release))

          dated.sort(key=lambda item: item[0])
          result = []
          for index, (published_date, release) in enumerate(dated):
              if published_date < since_date:
                  continue

              tag = release["tagName"]
              previous_tag = dated[index - 1][1]["tagName"] if index > 0 else ""
              range_spec = f"{previous_tag}..{tag}" if previous_tag else tag
              try:
                  log = subprocess.check_output(
                      ["git", "log", "--format=%s", range_spec],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  log = ""

              prs = sorted({int(match) for match in re.findall(r"#(\d+)", log)})
              result.append({
                  "tagName": tag,
                  "name": release.get("name"),
                  "url": release.get("url"),
                  "publishedAt": release.get("publishedAt"),
                  "isPrerelease": release.get("isPrerelease"),
                  "previousTag": previous_tag,
                  "pullRequests": prs,
              })

          pathlib.Path("/tmp/github-data/release-prs.json").write_text(json.dumps(result, indent=2))
          PY

      - name: Collect feature flag definitions
        if: ${{ matrix.feature_flags }}
        run: |
          cp /tmp/repo/feature-flags.json /tmp/github-data/feature-flags.json 2>/dev/null || echo '{}' > /tmp/github-data/feature-flags.json

      - name: Write repo collection summary
        env:
          REPO: ${{ matrix.repo }}
          NAME: ${{ matrix.name }}
          FEATURE_FLAGS: ${{ matrix.feature_flags }}
          SINCE: ${{ needs.prepare.outputs.since }}
        run: |
          SAFE_NAME=$(echo "$REPO" | tr '/' '-')
          {
            echo "# ${NAME}"
            echo
            echo "- Repository: ${REPO}"
            echo "- Since: ${SINCE}"
            echo "- Feature flag review required: ${FEATURE_FLAGS}"
            echo
            echo "## Entire Dispatch Output"
            echo
            cat /tmp/entire-dispatch.md
            echo
            echo "## GitHub Data Files"
            echo
            echo "- releases.json"
            echo "- release-prs.json"
            echo "- merged-prs.json"
            echo "- open-prs.json"
            if [ "${FEATURE_FLAGS}" = "true" ]; then
              echo "- feature-flags.json"
              echo "- posthog_flags.json"
            fi
          } > "/tmp/collection-${SAFE_NAME}.md"

          mkdir -p "/tmp/collection-${SAFE_NAME}"
          cp "/tmp/collection-${SAFE_NAME}.md" "/tmp/collection-${SAFE_NAME}/summary.md"
          cp /tmp/github-data/*.json "/tmp/collection-${SAFE_NAME}/"

      - name: Upload repo collection
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ strategy.job-index }}
          path: /tmp/collection-*
          retention-days: 7

  draft:
    name: Draft Dispatch
    runs-on: ubuntu-latest
    needs: [prepare, collect]

    container:
      image: ghcr.io/block/goose:latest
      options: --user root
      env:
        GOOSE_PROVIDER: openrouter
        GOOSE_MODEL: anthropic/claude-opus-4.5
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        HOME: /tmp/goose-home

    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y jq

      - name: Download repo collections
        uses: actions/download-artifact@v4
        with:
          pattern: collection-*
          path: /tmp/collections
          merge-multiple: true

      - name: Download dispatch examples
        uses: actions/download-artifact@v4
        with:
          name: dispatch-examples
          path: /tmp/dispatch-examples

      - name: Download PostHog flags
        uses: actions/download-artifact@v4
        with:
          name: posthog-flags
          path: /tmp

      - name: Generate dispatch draft
        env:
          SINCE: ${{ needs.prepare.outputs.since }}
        run: |
          mkdir -p "$HOME/.local/share/goose/sessions" "$HOME/.config/goose"

          cat > /tmp/recipe.yaml <<'RECIPE_EOF'
          version: "1.0.0"
          title: "Release Summary Dispatch V2"
          description: "Draft a Marvin dispatch from pre-collected repo data"

          extensions:
            - type: builtin
              name: developer

          instructions: |
            Draft a complete Entire Dispatch blog post using only the files already collected in /tmp/collections and /tmp/dispatch-examples.
            Do not run GitHub, git, curl, or repository investigation commands. The goal is synthesis, categorization, and writing.

            Inputs:
            - /tmp/collections contains one folder per repository with summary.md, releases.json, release-prs.json, merged-prs.json, open-prs.json, and sometimes feature-flags.json.
            - /tmp/posthog_flags.json contains current PostHog feature flag state when available.
            - /tmp/dispatch-examples contains recent dispatch blog posts for Marvin's voice and frontmatter style.
            - The window starts at SINCE_PLACEHOLDER.

            Repositories and section headings:
            - entirehq/entire.io -> Entire Web
            - entireio/cli -> Entire CLI
            - go-git/go-git -> Go-Git
            - entirehq/entiredb -> EntireDB
            - entireio/git-sync -> Git-Sync

            Categorize source material into:
            - Released: stable release items and publicly shipped web work
            - Nightly: prerelease/nightly items
            - Merged: merged work that is not clearly in a stable or nightly release
            - Feature flagged: Entire Web work that is merged but hidden, partially rolled out, internal-only, or disabled

            Requirements:
            - Include PR numbers and links whenever the collection data provides them.
            - Prefer concrete user-facing changes over raw implementation titles.
            - Use the dispatch examples to match Marvin: dry, mildly weary, clear, and restrained. No generic robot noise.
            - Include frontmatter with title, description, category: Dispatch, author: Marvin.
            - Include an intro, then sections for Entire Web, Entire CLI, Go-Git, EntireDB, and Git-Sync when they have material.
            - Keep feature-flagged work out of the public/released prose unless explicitly labeled as feature flagged.
            - Preserve release/nightly distinction for Entire CLI and Git-Sync.
            - If a repo has no useful material, omit its section instead of announcing absence.
            - Write the final markdown to /tmp/dispatch-draft.md.

          prompt: |
            Read /tmp/collections and /tmp/dispatch-examples, then draft the dispatch.
            Organize it by repository section and categorize the work as released, nightly, merged, or feature flagged where relevant.
            Keep PR numbers attached to the items.
          RECIPE_EOF

          sed -i "s|SINCE_PLACEHOLDER|${SINCE}|g" /tmp/recipe.yaml
          goose run --recipe /tmp/recipe.yaml

          if [ ! -s /tmp/dispatch-draft.md ]; then
            echo "::error::Goose did not write /tmp/dispatch-draft.md"
            exit 1
          fi

      - name: Upload dispatch draft
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-draft
          path: /tmp/dispatch-draft.md
          retention-days: 7

  post-slack:
    name: Post Slack Message
    runs-on: ubuntu-latest
    needs: draft

    steps:
      - name: Download dispatch draft
        uses: actions/download-artifact@v4
        with:
          name: dispatch-draft
          path: ${{ runner.temp }}

      - name: Post draft to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SUMMARY_PATH: ${{ runner.temp }}/dispatch-draft.md
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["SLACK_CHANNEL_ID"]
          text = pathlib.Path(os.environ["SUMMARY_PATH"]).read_text()

          payload = json.dumps({
              "channel": channel,
              "text": text,
              "unfurl_links": False,
              "unfurl_media": False,
          }).encode()

          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              response = json.loads(resp.read().decode())
          if not response.get("ok"):
              raise SystemExit(f"Slack API error: {response.get('error')}")
          PY
