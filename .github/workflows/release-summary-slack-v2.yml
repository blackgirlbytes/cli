name: Release Summary to Slack V2

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repositories to include"
        required: true
        type: choice
        options:
          - all
          - entirehq/entire.io
          - entireio/cli
          - go-git/go-git
          - entirehq/entiredb
          - entireio/git-sync
          - entireio/external-agents
          - entireio/forgemark
          - entireio/go-nuts
          - jdx/mise
      post_to_slack:
        description: "Upload the completed draft to Slack"
        required: true
        type: boolean
        default: true
  schedule:
    # Canonical weekly draft: Monday at 10am PT during daylight time (17:00 UTC).
    - cron: "0 17 * * 1"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Dispatch Context
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.window.outputs.since }}
      github_since: ${{ steps.window.outputs.github_since }}
      current_date: ${{ steps.window.outputs.current_date }}
      matrix: ${{ steps.repos.outputs.matrix }}

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve dispatch window
        id: window
        env:
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/entirehq/entire.io.git" /tmp/entire-io

          CURRENT_DATE=$(TZ=America/New_York date +%F)
          CURRENT_DATE_NUM=$(printf '%s' "$CURRENT_DATE" | tr -d '-')
          DISPATCH_DIR="/tmp/entire-io/website/src/routes/_content/blog/-content"
          find "$DISPATCH_DIR" -maxdepth 1 -type f \( -iname '*dispatch*.md' -o -iname '*dispatch*.mdx' \) | sort | while read -r f; do
            FILE_DATE=$(basename "$f" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            FILE_DATE_NUM=$(printf '%s' "$FILE_DATE" | tr -d '-')
            if [ -n "$FILE_DATE" ] && [ "$FILE_DATE_NUM" -le "$CURRENT_DATE_NUM" ]; then
              echo "$f"
            fi
          done > /tmp/dispatch-files.txt

          LATEST_DISPATCH=$(tail -1 /tmp/dispatch-files.txt)

          if [ -z "$LATEST_DISPATCH" ]; then
            echo "::error::No dispatch posts dated on or before ${CURRENT_DATE} found in ${DISPATCH_DIR}"
            exit 1
          fi

          FILENAME=$(basename "$LATEST_DISPATCH")
          SINCE=$(echo "$FILENAME" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')

          if [ -z "$SINCE" ]; then
            echo "::error::Could not extract dispatch date from ${FILENAME}"
            exit 1
          fi

          echo "since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "github_since=${SINCE}" >> "$GITHUB_OUTPUT"
          echo "current_date=${CURRENT_DATE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Using latest dispatch ${FILENAME}; collecting changes from ${SINCE} through ${CURRENT_DATE}."

          mkdir -p /tmp/dispatch-examples
          tail -4 /tmp/dispatch-files.txt | while read -r f; do
            cp "$f" /tmp/dispatch-examples/
          done
          cp "$LATEST_DISPATCH" /tmp/previous-dispatch.md

      - name: Build repo matrix
        id: repos
        env:
          INPUT_REPOS: ${{ inputs.repos || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SELECTION="$INPUT_REPOS"
          if [ "$EVENT_NAME" = "schedule" ]; then
            SELECTION=all
          fi
          python3 scripts/dispatch/dispatch_manifest.py matrix \
            --config .github/dispatch-projects.json \
            --selection "$SELECTION" | tee /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Audit active unconfigured public repositories
        env:
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT || github.token }}
          SINCE: ${{ steps.window.outputs.since }}
        run: |
          {
            echo "# Dispatch repository audit"
            echo
            echo "Public repositories updated since ${SINCE} but absent from .github/dispatch-projects.json:"
            echo
          } > /tmp/dispatch-repository-audit.md

          for org in entireio entirehq; do
            gh repo list "$org" --limit 1000 \
              --json nameWithOwner,pushedAt,isArchived,visibility \
              > "/tmp/${org}-repositories.json"
            jq -r --arg since "${SINCE}T00:00:00Z" \
              --slurpfile config .github/dispatch-projects.json '
                [$config[0].repositories[].repo] as $configured
                | .[]
                | select(.isArchived == false and .visibility == "PUBLIC" and .pushedAt >= $since)
                | select((.nameWithOwner as $repo | $configured | index($repo)) == null)
                | "- `\(.nameWithOwner)` — last pushed \(.pushedAt)"
              ' "/tmp/${org}-repositories.json" >> /tmp/dispatch-repository-audit.md
          done

          if ! grep -q '^- `' /tmp/dispatch-repository-audit.md; then
            echo "- None" >> /tmp/dispatch-repository-audit.md
          else
            while IFS= read -r repo; do
              echo "::warning::Dispatch inventory does not cover ${repo}"
            done < <(sed -n 's/^- `\([^`]*\)`.*/\1/p' /tmp/dispatch-repository-audit.md)
          fi

      - name: Upload dispatch examples
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-examples
          path: /tmp/dispatch-examples
          retention-days: 7

      - name: Upload previous dispatch
        uses: actions/upload-artifact@v4
        with:
          name: previous-dispatch
          path: /tmp/previous-dispatch.md
          retention-days: 7

      - name: Upload repository audit
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: /tmp/dispatch-repository-audit.md
          retention-days: 30

      - name: Fetch PostHog feature flags
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY || secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST || vars.POSTHOG_HOST || vars.POSTHOG_ENDPOINT || 'https://eu.posthog.com' }}
        run: |
          if [ -z "${POSTHOG_PERSONAL_API_KEY}" ] || [ -z "${POSTHOG_PROJECT_ID}" ]; then
            echo '{"results":[]}' > /tmp/posthog_flags.json
            echo "::warning::PostHog credentials are not configured; feature flag status will need manual review."
            exit 0
          fi

          POSTHOG_API_HOST="${POSTHOG_API_HOST%/}"
          STATUS=$(curl -sS -w "%{http_code}" -o /tmp/posthog_flags.json \
            -H "Authorization: Bearer ${POSTHOG_PERSONAL_API_KEY}" \
            "${POSTHOG_API_HOST}/api/projects/${POSTHOG_PROJECT_ID}/feature_flags/?limit=100")

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::warning::PostHog feature flag fetch failed with HTTP ${STATUS}; feature flag status will need manual review."
            echo '{"results":[]}' > /tmp/posthog_flags.json
          fi

      - name: Upload feature flags
        uses: actions/upload-artifact@v4
        with:
          name: posthog-flags
          path: /tmp/posthog_flags.json
          retention-days: 7

  collect:
    name: Collect (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Clone target repository
        env:
          REPO: ${{ matrix.repo }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT || github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/repo
          cd /tmp/repo
          git fetch --tags

      - name: Collect GitHub release and PR data
        env:
          REPO: ${{ matrix.repo }}
          SINCE: ${{ needs.prepare.outputs.since }}
          CURRENT_DATE: ${{ needs.prepare.outputs.current_date }}
          GH_TOKEN: ${{ secrets.ENTIRE_IO_PAT || github.token }}
        run: |
          SAFE_NAME=$(echo "$REPO" | tr '/' '-')
          mkdir -p "/tmp/collection-${SAFE_NAME}"
          python3 scripts/dispatch/dispatch_manifest.py collect \
            --config .github/dispatch-projects.json \
            --repo "$REPO" \
            --checkout /tmp/repo \
            --since "$SINCE" \
            --until "$CURRENT_DATE" \
            --output "/tmp/collection-${SAFE_NAME}/manifest.json"

      - name: Upload repo collection
        uses: actions/upload-artifact@v4
        with:
          name: collection-${{ strategy.job-index }}
          path: /tmp/collection-*
          retention-days: 7

  draft:
    name: Draft Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare, collect]

    container:
      image: ghcr.io/block/goose:latest
      options: --user root
      env:
        GOOSE_PROVIDER: anthropic
        GOOSE_MODEL: claude-sonnet-4-6
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        HOME: /tmp/goose-home

    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: apt-get update && apt-get install -y jq python3

      - name: Download repo collections
        uses: actions/download-artifact@v4
        with:
          pattern: collection-*
          path: /tmp/collections
          merge-multiple: true

      - name: Download dispatch examples
        uses: actions/download-artifact@v4
        with:
          name: dispatch-examples
          path: /tmp/dispatch-examples

      - name: Download PostHog flags
        uses: actions/download-artifact@v4
        with:
          name: posthog-flags
          path: /tmp

      - name: Download previous dispatch
        uses: actions/download-artifact@v4
        with:
          name: previous-dispatch
          path: /tmp

      - name: Download repository audit
        uses: actions/download-artifact@v4
        with:
          name: repository-audit
          path: /tmp

      - name: Generate dispatch draft
        env:
          SINCE: ${{ needs.prepare.outputs.since }}
          CURRENT_DATE: ${{ needs.prepare.outputs.current_date }}
        run: scripts/dispatch/generate.sh

      - name: Upload dispatch bundle
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-bundle
          path: /tmp/dispatch-bundle
          retention-days: 30

  post-slack:
    name: Upload Slack Markdown
    runs-on: ubuntu-latest
    needs: draft
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.post_to_slack }}

    steps:
      - name: Download dispatch bundle
        uses: actions/download-artifact@v4
        with:
          name: dispatch-bundle
          path: ${{ runner.temp }}

      - name: Upload draft markdown to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          MD_FILE: ${{ runner.temp }}/dispatch-draft.md
          SLACK_FILE_TITLE: Entire Dispatch Draft
          SLACK_INITIAL_COMMENT: Dispatch draft attached as a Markdown file.
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          token = os.environ["SLACK_BOT_TOKEN"]
          channel = os.environ["SLACK_CHANNEL_ID"]
          path = pathlib.Path(os.environ["MD_FILE"])
          title = os.environ["SLACK_FILE_TITLE"]
          initial_comment = os.environ["SLACK_INITIAL_COMMENT"]
          data = path.read_bytes()

          def slack_api(method, payload):
              form_payload = {
                  key: json.dumps(value) if isinstance(value, (list, dict)) else value
                  for key, value in payload.items()
              }
              req = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=urllib.parse.urlencode(form_payload).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/x-www-form-urlencoded; charset=utf-8",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  response = json.loads(resp.read().decode())
              if not response.get("ok"):
                  messages = response.get("response_metadata", {}).get("messages", [])
                  detail = f" ({'; '.join(messages)})" if messages else ""
                  raise SystemExit(f"Slack API error from {method}: {response.get('error')}{detail}")
              return response

          upload = slack_api("files.getUploadURLExternal", {
              "filename": path.name,
              "length": len(data),
              "snippet_type": "markdown",
          })

          req = urllib.request.Request(
              upload["upload_url"],
              data=data,
              headers={"Content-Type": "application/octet-stream"},
              method="POST",
          )
          with urllib.request.urlopen(req) as resp:
              if resp.status < 200 or resp.status >= 300:
                  raise SystemExit(f"Slack file upload failed with HTTP {resp.status}")

          slack_api("files.completeUploadExternal", {
              "channel_id": channel,
              "initial_comment": initial_comment,
              "files": [{"id": upload["file_id"], "title": title}],
          })
          PY
