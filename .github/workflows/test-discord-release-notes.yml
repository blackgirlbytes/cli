name: Test Discord Release Notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test with (e.g., v0.5.1)'
        required: true
        type: string

jobs:
  test-discord:
    name: Test Discord Post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes from CHANGELOG.md
        id: extract-notes
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" 'BEGIN{header="^## \\[" ver "\\]"} $0 ~ header{found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "::error::No changelog entry found for version ${VERSION}"
            exit 1
          fi

          echo "::notice::Extracted $(wc -c < /tmp/release_notes.md) chars of release notes"
          cat /tmp/release_notes.md

          DELIMITER="EOF_$(openssl rand -hex 8)"
          echo "notes<<$DELIMITER" >> "$GITHUB_OUTPUT"
          cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Post release announcement to Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          RELEASE_NOTES: ${{ steps.extract-notes.outputs.notes }}
        shell: bash
        run: |
          if [ -z "$DISCORD_CHANNEL_ID" ] || [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::DISCORD_BOT_TOKEN and DISCORD_CHANNEL_ID secrets must be set"
            exit 1
          fi

          SAFE_LIMIT=1800

          send_discord() {
            local content="$1"
            local channel="$2"

            content=$(echo "$content" | jq -Rs .)

            response=$(curl -sf -X POST "https://discord.com/api/v10/channels/${channel}/messages" \
              -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": $content}")

            if [ $? -ne 0 ]; then
              echo "::warning::Discord API error" >&2
              return 1
            fi

            echo "$response" | jq -r '.id // empty'
          }

          create_thread() {
            local channel="$1"
            local message_id="$2"
            local thread_name="$3"

            response=$(curl -sf -X POST "https://discord.com/api/v10/channels/${channel}/messages/${message_id}/threads" \
              -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${thread_name}\"}")

            echo "$response" | jq -r '.id // empty'
          }

          HEADER="## Entire CLI ${RELEASE_TAG} is here!

          **Release:** ${RELEASE_URL}"

          FOOTER="

          See https://docs.entire.io/cli/installation for help installing and updating."

          # Check if everything fits in one message
          FULL_MSG="${HEADER}

          ${RELEASE_NOTES}
          ${FOOTER}"

          if [ ${#FULL_MSG} -le "$SAFE_LIMIT" ]; then
            send_discord "$FULL_MSG" "$DISCORD_CHANNEL_ID"
            echo "::notice::Discord notification sent (single message)"
            exit 0
          fi

          # Need to split — fit what we can in the main message, overflow into a thread
          THREAD_FOOTER="

          *More in thread...*"

          HEADER_LEN=${#HEADER}
          THREAD_FOOTER_LEN=${#THREAD_FOOTER}
          AVAILABLE=$((SAFE_LIMIT - HEADER_LEN - THREAD_FOOTER_LEN - 10))

          echo "$RELEASE_NOTES" > /tmp/release_notes_full.txt

          awk -v avail="$AVAILABLE" '
          BEGIN { main_len = 0; in_thread = 0 }
          {
            line_len = length($0) + 1
            if (!in_thread && (main_len + line_len) <= avail) {
              print > "/tmp/main_content.txt"
              main_len += line_len
            } else {
              in_thread = 1
              print > "/tmp/thread_content.txt"
            }
          }
          ' /tmp/release_notes_full.txt

          MAIN_CONTENT=""
          [ -f /tmp/main_content.txt ] && MAIN_CONTENT=$(cat /tmp/main_content.txt)

          THREAD_CONTENT=""
          [ -f /tmp/thread_content.txt ] && THREAD_CONTENT=$(cat /tmp/thread_content.txt)

          MAIN_MESSAGE="${HEADER}

          ${MAIN_CONTENT}
          ${THREAD_FOOTER}"

          MESSAGE_ID=$(send_discord "$MAIN_MESSAGE" "$DISCORD_CHANNEL_ID")

          if [ -z "$MESSAGE_ID" ]; then
            echo "::error::Failed to send Discord message"
            exit 1
          fi

          echo "Created message $MESSAGE_ID, creating thread..."
          sleep 1

          THREAD_ID=$(create_thread "$DISCORD_CHANNEL_ID" "$MESSAGE_ID" "Release Notes ${RELEASE_TAG}")
          if [ -z "$THREAD_ID" ]; then
            echo "::warning::Failed to create thread"
            exit 1
          fi
          sleep 1

          if [ -n "$THREAD_CONTENT" ]; then
            THREAD_MSG="${THREAD_CONTENT}
            ${FOOTER}"

            if [ ${#THREAD_MSG} -le "$SAFE_LIMIT" ]; then
              send_discord "$THREAD_MSG" "$THREAD_ID"
            else
              awk -v limit="$SAFE_LIMIT" '
              BEGIN { chunk = ""; chunk_len = 0; chunk_num = 0 }
              {
                line_len = length($0) + 1
                if (chunk_len + line_len > limit && chunk_len > 0) {
                  print chunk > "/tmp/chunk_" chunk_num ".txt"
                  chunk_num++
                  chunk = $0 "\n"
                  chunk_len = line_len
                } else {
                  chunk = chunk $0 "\n"
                  chunk_len += line_len
                }
              }
              END {
                if (chunk_len > 0) {
                  print chunk > "/tmp/chunk_" chunk_num ".txt"
                }
              }
              ' /tmp/thread_content.txt

              for chunk_file in /tmp/chunk_*.txt; do
                [ -f "$chunk_file" ] || continue
                CHUNK=$(cat "$chunk_file")
                [ -n "$CHUNK" ] && send_discord "$CHUNK" "$THREAD_ID"
                sleep 1
                rm -f "$chunk_file"
              done

              send_discord "See https://docs.entire.io/cli/installation for help installing and updating." "$THREAD_ID"
            fi
          fi

          rm -f /tmp/release_notes_full.txt /tmp/main_content.txt /tmp/thread_content.txt

          echo "::notice::Discord notification sent successfully"
